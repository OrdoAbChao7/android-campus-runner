[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-runner"
version = "0.1.0"
description = "Minimal Android device automation runner"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "uiautomator2>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
android-runner = "android_runner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
